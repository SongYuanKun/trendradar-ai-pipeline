# TrendRadar AI 分析管道 - 配置示例
# 复制为 config.yaml 并确保敏感项使用 env: 引用，勿提交真实密钥
# cp config.example.yaml config.yaml

mcp:
  base_url: "http://127.0.0.1:3333/mcp"
  tools:
    get_latest_news:
      limit: 50
      include_url: true
    # 可选: get_trending_topics / get_latest_rss

ai:
  api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "qwen3.5-plus"
  api_key: "env:BAILIAN_API_KEY"
  timeout: 120
  max_retries: 3
  batch_size: 10  # 批量分析时每批条数，0 表示单条模式

downstream:
  enabled: false  # 纯测试默认不发布；确认上线后再改 true
  url: "http://127.0.0.1:8080/api/ingest"
  timeout: 30
  max_retries: 2
  # 若 xiaohongshu-mcp 需要认证，可配置
  # api_key: "env:XIAOHONGSHU_API_KEY"

blog:
  enabled: false
  repo_path: "/home/kun/vs_code/dev-tools-nav"
  commit: true
  push: false  # 确认无误后可开启；开启后会触发工具箱站 GitHub Actions

scheduler:
  run_on_startup: false  # 防止容器重启时误触发发布
  cron: "0 9 * * 1,3,5"  # 每周三篇：周一/三/五 09:00
  # interval_seconds: 3600   # 或使用间隔秒数，与 cron 二选一

logging:
  level: "INFO"
  path: "logs/pipeline.log"
