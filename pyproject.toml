[project]
name = "trendradar-ai-pipeline"
version = "0.1.0"
description = "TrendRadar AI 分析管道：MCP 取数 → 百炼分析 → 投递 xiaohongshu-mcp"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.12.0,<2.14.0",
    "httpx>=0.28.0",
    "litellm>=1.57.0,<2.0.0",
    "apscheduler>=3.10.0,<4.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "tenacity>=8.0.0,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
